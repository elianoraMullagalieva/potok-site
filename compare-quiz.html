<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Квиз на телефоне — 3 варианта</title>
<style>
  body { margin: 0; padding: 28px 24px 40px; background: #ecebe7; font-family: -apple-system, 'Inter Tight', sans-serif; color: #1f2026; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 500; letter-spacing: -0.03em; }
  p.lead { margin: 0 0 24px; color: #6b6c72; font-size: 15px; }
  .row { display: flex; gap: 22px; justify-content: center; }
  figure { margin: 0; width: 242px; }
  .phone { width: 390px; height: 844px; transform: scale(.62); transform-origin: top left; border-radius: 54px; overflow: hidden; box-shadow: 0 0 0 10px #111, 0 30px 60px -20px rgba(0,0,0,.45); background: #fff; }
  .wrap { width: 242px; height: 524px; }
  iframe { width: 390px; height: 844px; border: 0; display: block; }
  figcaption { margin-top: 26px; }
  figcaption b { display: block; font-size: 17px; font-weight: 600; }
  figcaption span { display: block; margin-top: 4px; font-size: 14px; line-height: 1.4; color: #6b6c72; }
</style></head>
<body>
  <h1>Экран «Ваш расчёт готов» на телефоне</h1>
  <p class="lead">Три раскладки, чтобы подарки и форма были на одном экране (iPhone 390 × 844)</p>
  <div class="row">
    <figure><div class="wrap"><div class="phone"><iframe src="/potok-site/v2/?nopre&qready&qm=1"></iframe></div></div>
      <figcaption><b>1. Миниатюры в ряд</b><span>Три подарка маленькими карточками сверху, сразу под ними форма. Самый короткий, всё видно с первого взгляда.</span></figcaption></figure>
    <figure><div class="wrap"><div class="phone"><iframe src="/potok-site/v2/?nopre&qready&qm=2"></iframe></div></div>
      <figcaption><b>2. Подарки листаются</b><span>Крупные карточки, видно край следующей — хочется пролистать. Скриншоты читаются лучше, форма под ними.</span></figcaption></figure>
    <figure><div class="wrap"><div class="phone"><iframe src="/potok-site/v2/?nopre&qready&qm=3"></iframe></div></div>
      <figcaption><b>3. Форма сверху</b><span>Сначала «Ваш расчёт готов» и поля, ниже список «что придёт» строками с превью. Фокус на заявке.</span></figcaption></figure>
  </div>
</body></html>
